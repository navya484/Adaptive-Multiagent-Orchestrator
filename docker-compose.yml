version: '3.8'

services:
  # The Data Layer
  postgres:
    image: ankane/pgvector:latest
    container_name: platform_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: multiagent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: platform_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  # The Application Layer
  backend:
    build: 
      context: ./backend_api
    container_name: platform_backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: platform_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  # The Observability Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: platform_prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: platform_grafana
    ports:
      - "3001:3000" # Expose Grafana on 3001 to avoid Next.js conflict
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pgdata:
