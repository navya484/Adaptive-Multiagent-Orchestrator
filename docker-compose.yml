version: '3.8'

services:
  postgres:
    # ankane/pgvector is a standard Postgres image with the pgvector extension pre-compiled
    image: ankane/pgvector:latest
    container_name: platform_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: multiagent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: platform_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
